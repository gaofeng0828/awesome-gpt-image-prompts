name: Scrape Tweet

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'X/Twitter URL to scrape'
        required: true
        type: string

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Scrape tweet
        env:
          TWEET_URL: ${{ inputs.url }}
        run: bash scripts/scrape-and-deploy.sh "$TWEET_URL"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "scrape: ${{ inputs.url }}"
            git push
          fi
