name: Scrape Tweet

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'X/Twitter URL to scrape'
        required: true
        type: string
      prompt:
        description: 'Prompt text (user provided)'
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Scrape tweet
        env:
          TWEET_URL: ${{ inputs.url }}
          USER_PROMPT: ${{ inputs.prompt }}
        run: bash scripts/scrape-and-deploy.sh "$TWEET_URL"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "scrape: ${{ inputs.url }}"
            git push
          fi

      - name: Build site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5